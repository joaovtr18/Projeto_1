# Configuração do servidor web (nginx) da loja Compra Certa — servidor web01
# CENÁRIO DE AULA — configuração propositalmente INSEGURA.
#
# O nginx é o "porteiro" do site: recebe os acessos da internet, entrega os
# arquivos públicos (imagens, CSS) e repassa o resto para a aplicação Python,
# que roda na porta 8000 da própria máquina.

server {
    listen 80;
    server_name loja.compracerta.com.br;

    # mostra a versão exata do nginx nas páginas de erro
    server_tokens on;

    # pasta pública do site — o config.env da aplicação foi copiado para cá como .env
    root /var/www/compracerta/public;

    # se a pasta não tiver index, lista todos os arquivos dela
    autoindex on;

    access_log /var/log/nginx/access.log;

    # arquivos estáticos
    location /static/ {
        expires 7d;
    }

    # painel administrativo
    location /admin {
        proxy_pass http://127.0.0.1:8000;
    }

    # login do painel
    location = /login {
        proxy_pass http://127.0.0.1:8000;
    }

    # todo o resto vai para a aplicação
    location / {
        try_files $uri $uri/ @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:8000;
    }
}
